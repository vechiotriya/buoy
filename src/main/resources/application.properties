spring.application.name=buoy
rsa.private-key=file:/etc/secrets/private.pem
rsa.public-key=file:/etc/secrets/public.pem
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_ID}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
 
# Allowed image types (comma-separated)
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp,image/svg+xml
 
# Optional: default upload folder in Cloudinary
app.upload.folder=uploads